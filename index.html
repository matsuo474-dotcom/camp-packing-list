<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持ち物チェック</title>
<style>
  :root{
    --green:#2e7d4f; --green-dark:#1f5c39; --bg:#f7f8f7; --card:#ffffff;
    --text:#242424; --muted:#707070; --line:#e6e6e6; --accent:#e8862e;
    --danger:#c0453e; --hover:#f0f4f0; --active:#e3efe6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column;}
  header{background:var(--green); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; z-index:20;}
  header h1{margin:0; font-size:17px; font-weight:600; flex:1;}
  #menuBtn{display:none; background:none; border:none; color:#fff; font-size:21px; cursor:pointer; padding:4px 6px; line-height:1;}
  .conn{font-size:12px; opacity:.92; white-space:nowrap;}
  .conn .dot{display:inline-block; width:8px; height:8px; border-radius:99px; background:#cfd8cc; margin-right:4px; vertical-align:1px;}
  .conn.on .dot{background:#8be09e;}
  .layout{flex:1; display:flex; min-height:0;}
  /* ===== サイドバー ===== */
  aside{width:264px; flex:none; background:#fbfcfb; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
  aside .side-label{font-size:12.5px; color:var(--muted); padding:14px 16px 6px; font-weight:600;}
  ul.side-lists{list-style:none; margin:0; padding:0 8px; overflow-y:auto; flex:1;}
  ul.side-lists li{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; cursor:pointer; font-size:15px; margin-bottom:2px;}
  ul.side-lists li:hover{background:var(--hover);}
  ul.side-lists li.active{background:var(--active); box-shadow:inset 3px 0 0 var(--green); font-weight:600;}
  ul.side-lists .ic{color:var(--muted); font-size:14px; flex:none;}
  ul.side-lists .lname{flex:1; word-break:break-all;}
  ul.side-lists .count{flex:none; font-size:13px; color:var(--muted); min-width:18px; text-align:right;}
  .side-foot{padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  #newListBtn{background:none; border:none; color:var(--green-dark); font-size:15px; font-weight:600; text-align:left; padding:8px 6px; cursor:pointer; border-radius:8px;}
  #newListBtn:hover{background:var(--hover);}
  #sidebarBackdrop{display:none;}
  /* ===== メイン ===== */
  main{flex:1; overflow-y:auto; min-width:0;}
  .main-inner{max-width:680px; margin:0 auto; padding:0 14px 44px;}
  .sticky-top{position:sticky; top:0; z-index:6; background:var(--bg); padding:14px 0 10px;}
  h2.list-title{margin:0; font-size:23px; font-weight:700; color:var(--green-dark); display:flex; align-items:center; gap:10px;}
  .progress-wrap{margin:8px 0 10px;}
  .progress-bar{height:8px; background:#e4ece2; border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--green); width:0%; transition:width .25s;}
  .progress-text{font-size:12.5px; color:var(--muted); margin-top:5px;}
  .addbar{display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 6px 6px 12px;}
  .addbar .plus{color:var(--green); font-size:19px; font-weight:700; flex:none; line-height:1;}
  .addbar input[type=text]{flex:1; border:none; padding:8px 0; font-size:16px; background:none; color:var(--text); min-width:0;}
  .addbar input[type=text]:focus{outline:none;}
  .addbar button{flex:none; padding:9px 16px;}
  #addTargetBar{display:flex; align-items:center; gap:8px; margin-top:8px; background:#fdf3e3; border:1px solid #f0dcae; color:#7a5410; border-radius:9px; padding:7px 10px; font-size:13.5px;}
  #addTargetBar .tname{font-weight:700; flex:1; word-break:break-all;}
  #addTargetClear{flex:none; background:none; border:none; color:#7a5410; font-size:15px; cursor:pointer; padding:2px 6px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .hidden{display:none !important;}
  button{border:none; border-radius:9px; padding:11px 14px; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:active{background:var(--green-dark);}
  .btn-sub{background:#eef3ec; color:var(--green-dark); border:1px solid var(--line);}
  .btn-accent{background:var(--accent); color:#fff; width:100%;}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid var(--line);}
  .msg{font-size:13px; color:var(--danger); min-height:16px; margin-top:4px;}
  .note{font-size:12.5px; color:var(--muted); line-height:1.6;}
  ul.items{list-style:none; margin:0 0 12px; padding:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  ul.items li{display:flex; align-items:center; gap:9px; padding:11px 12px; border-bottom:1px solid var(--line); background:var(--card);}
  ul.items li:last-child{border-bottom:none;}
  ul.items li.parent-row{background:#f2f6f0;}
  ul.items li.parent-row .name{font-weight:700;}
  ul.items li.child-row{padding-left:40px;}
  ul.items li.done .name{color:var(--muted); text-decoration:line-through;}
  ul.items li{user-select:none; -webkit-user-select:none;}
  ul.items li.drag-lift{box-shadow:0 8px 22px rgba(0,0,0,.28); background:#fff !important;}
  ul.items li.drop-target{box-shadow:inset 0 0 0 2px var(--accent);}
  ul.items input[type=checkbox]{appearance:none; -webkit-appearance:none; width:24px; height:24px; flex:none; margin:0; border:2px solid #9db89d; border-radius:50%; background:#fff; cursor:pointer; position:relative;}
  ul.items input[type=checkbox]:checked{background:var(--green); border-color:var(--green);}
  ul.items input[type=checkbox]:checked::after{content:"✓"; position:absolute; inset:0; color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  ul.items .name{flex:1; font-size:15.5px; word-break:break-all;}
  ul.items .kidcount{flex:none; font-size:12.5px; color:var(--muted); font-weight:400;}
  .chev{flex:none; background:none; border:none; color:var(--muted); font-size:13px; padding:4px 2px; cursor:pointer; width:20px;}
  .handle{flex:none; color:#c3cec1; font-size:15px; padding:6px 2px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
  .handle:active{cursor:grabbing;}
  .mini{flex:none; background:#eef3ec; border:1px solid var(--line); color:var(--green-dark); font-size:12.5px; font-weight:700; padding:6px 9px; border-radius:8px; cursor:pointer;}
  .del{flex:none; background:none; border:none; color:#b9c4b6; font-size:18px; padding:4px 6px; cursor:pointer;}
  .empty{font-size:13.5px; color:var(--muted); padding:10px 2px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap;}
  .toolbar button{flex:1; white-space:nowrap; font-size:13.5px; padding:10px 8px;}
  .foot-note{font-size:11.5px; color:var(--muted); line-height:1.7; margin-top:4px;}
  /* ===== スマホ： サイドバーはドロワー ===== */
  @media (max-width:760px){
    #menuBtn{display:block;}
    aside{position:fixed; top:0; left:0; bottom:0; z-index:40; transform:translateX(-105%); transition:transform .22s ease; box-shadow:2px 0 14px rgba(0,0,0,.18); width:272px;}
    aside.open{transform:none;}
    #sidebarBackdrop{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35;}
    #sidebarBackdrop.show{display:block;}
  }
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="リスト一覧を開く">☰</button>
  <h1>🎒 持ち物チェック</h1>
  <span class="conn" id="connStatus"><span class="dot"></span><span id="connText">接続中…</span></span>
</header>
<div class="layout">
  <aside id="sidebar">
    <div class="side-label">家族の持ち物リスト</div>
    <ul class="side-lists" id="sidebarLists"></ul>
    <div class="side-foot">
      <button id="newListBtn">＋ 新しいリスト</button>
      <button id="shareBtn" class="btn-accent">共有リンクをコピー</button>
    </div>
  </aside>
  <div id="sidebarBackdrop"></div>
  <main id="mainScroll">
    <div class="main-inner">
      <div class="sticky-top">
        <h2 class="list-title"><span style="color:var(--green)">☰</span><span id="listTitle">リスト</span></h2>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">0 / 0 個チェック済み</div>
        </div>
        <div class="addbar">
          <span class="plus">＋</span>
          <input type="text" id="addName" placeholder="アイテムを追加">
          <button id="addBtn" class="btn-primary">追加</button>
        </div>
        <div id="addTargetBar" class="hidden">
          <span>追加先：</span><span class="tname" id="addTargetName"></span><span>の子</span>
          <button id="addTargetClear" aria-label="追加先を解除">✕</button>
        </div>
        <div id="addMsg" class="msg"></div>
      </div>

      <div id="listWrap"></div>

      <div class="card">
        <div class="toolbar">
          <button id="resetChecksBtn" class="btn-sub">チェックを全部外す</button>
          <button id="addPresetBtn" class="btn-sub">定番（キャンプ）を追加</button>
          <button id="clearAllBtn" class="btn-danger">このリストを空にする</button>
          <button id="deleteListBtn" class="btn-danger">このリストを削除</button>
        </div>
      </div>
      <p class="foot-note">チェックや追加は、このリンクを開いている全員の画面にリアルタイムで反映されます。リンクを知っている人は誰でもリストを見たり編集したりできます。</p>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
"use strict";
/* ===== Firebase設定 ===== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCGDTToPt_XkJf6UM9FFPfxs4vGR7qF0Es",
  authDomain: "camp-packing-list.firebaseapp.com",
  databaseURL: "https://camp-packing-list-default-rtdb.firebaseio.com",
  projectId: "camp-packing-list",
  storageBucket: "camp-packing-list.firebasestorage.app",
  messagingSenderId: "686552196050",
  appId: "1:686552196050:web:867b4b4ac45a49cfde1e0b"
};
var CONFIG_READY = FIREBASE_CONFIG.apiKey.indexOf("__") !== 0;

/* ===== 定数 ===== */
var MIGRATION_CATS = ["テント・寝具", "調理・食事", "火・照明・電源", "衣類・身の回り", "遊び・その他"];
var PRESET_TREE = [
  { name: "テント・寝具", children: ["テント", "グランドシート", "ペグ・ハンマー", "寝袋", "マット", "枕"] },
  { name: "調理・食事", children: ["バーナー・ガス缶", "クッカー", "食器・カトラリー", "クーラーボックス", "保冷剤", "調味料", "ゴミ袋"] },
  { name: "火・照明・電源", children: ["ランタン", "ヘッドライト", "モバイルバッテリー", "充電ケーブル", "着火ライター", "焚き火台", "薪・炭"] },
  { name: "衣類・身の回り", children: ["着替え", "防寒着", "レインウェア", "タオル", "日焼け止め", "虫よけ", "常備薬", "ティッシュ・ウェットティッシュ"] },
  { name: "遊び・その他", children: ["チェア", "テーブル", "レジャーシート", "救急セット"] }
];
var DEFAULT_ROOM = "camp-vv2ru9wh";
var LS_LOCAL_PREFIX = "packingList.local.";
var LS_COLLAPSED_PREFIX = "packingList.collapsed.";

/* ===== 状態 ===== */
var roomCode = null;
var allData = {};        // listId -> {name, ts, items:{...}} （Firebaseモード）
var lists = {};          // listId -> {name, ts}
var currentListId = null;
var items = {};          // itemId -> {name, parentId, checked, ts} （現在のリスト分）
var db = null;
var listsRef = null;
var localMode = false;
var localData = null;    // {lists:{}, items:{listId:{}}, current:""}
var addTargetParentId = null;
var collapsedMap = {};   // listId -> {parentId: 1} （この端末だけの表示状態）

/* ===== DOM ===== */
var $ = function (id) { return document.getElementById(id); };
var connStatus = $("connStatus"), connText = $("connText");
var sidebar = $("sidebar"), sidebarLists = $("sidebarLists"), sidebarBackdrop = $("sidebarBackdrop");
var listTitle = $("listTitle");
var progressFill = $("progressFill"), progressText = $("progressText");
var addName = $("addName"), addMsg = $("addMsg");
var addTargetBar = $("addTargetBar"), addTargetName = $("addTargetName");
var listWrap = $("listWrap");
var mainScroll = $("mainScroll");

/* ===== ユーティリティ ===== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}
function validRoomCode(code) { return /^[A-Za-z0-9_-]{3,32}$/.test(code); }
function localId() { return "id-" + Date.now() + "-" + Math.floor(Math.random() * 1e9); }
function itemsOf(listId) {
  if (localMode) return (localData && localData.items[listId]) || {};
  var l = allData[listId];
  return (l && l.items) || {};
}
function childrenIn(map, pid) {
  return Object.keys(map).filter(function (id) { return (map[id].parentId || null) === pid; })
    .map(function (id) { return { id: id, item: map[id] }; })
    .sort(function (a, b) { return (a.item.ts || 0) - (b.item.ts || 0); });
}
function childrenOf(pid) { return childrenIn(items, pid); }
function topItems() { return childrenOf(null); }
function leavesIn(map) {
  return Object.keys(map).filter(function (id) { return childrenIn(map, id).length === 0; })
    .map(function (id) { return { id: id, item: map[id] }; });
}
function leaves() { return leavesIn(items); }
function uncheckedLeafCount(listId) {
  return leavesIn(itemsOf(listId)).filter(function (x) { return !x.item.checked; }).length;
}
function sortedLists() {
  return Object.keys(lists).map(function (id) { return { id: id, name: lists[id].name, ts: lists[id].ts || 0 }; })
    .sort(function (a, b) { return a.ts - b.ts; });
}
function isCollapsed(pid) {
  return !!(collapsedMap[currentListId] && collapsedMap[currentListId][pid]);
}
function setCollapsed(pid, on) {
  if (!collapsedMap[currentListId]) collapsedMap[currentListId] = {};
  if (on) collapsedMap[currentListId][pid] = 1; else delete collapsedMap[currentListId][pid];
  try { localStorage.setItem(LS_COLLAPSED_PREFIX + roomCode, JSON.stringify(collapsedMap)); } catch (e) {}
}
function loadCollapsed() {
  try {
    var raw = localStorage.getItem(LS_COLLAPSED_PREFIX + roomCode);
    if (raw) collapsedMap = JSON.parse(raw) || {};
  } catch (e) {}
}

/* ===== 描画 ===== */
function renderSidebar() {
  var html = "";
  sortedLists().forEach(function (l) {
    var n = uncheckedLeafCount(l.id);
    html += '<li data-list="' + escapeHtml(l.id) + '"' + (l.id === currentListId ? ' class="active"' : "") + '>' +
      '<span class="ic">☰</span><span class="lname">' + escapeHtml(l.name) + "</span>" +
      '<span class="count">' + (n > 0 ? n : "") + "</span></li>";
  });
  sidebarLists.innerHTML = html;
}
function itemRow(id, it, isChild) {
  var kids = childrenOf(id);
  var checked;
  if (kids.length) checked = kids.every(function (k) { return !!k.item.checked; });
  else checked = !!it.checked;
  var cls = (kids.length ? "parent-row" : (isChild ? "child-row" : "")) + (checked ? " done" : "");
  var html = '<li class="' + cls + '" data-id="' + escapeHtml(id) + '" data-parent="' + escapeHtml(it.parentId || "") + '">';
  if (kids.length) html += '<button class="chev" data-act="collapse" data-id="' + escapeHtml(id) + '">' + (isCollapsed(id) ? "▸" : "▾") + "</button>";
  html += '<span class="handle" data-handle="1" data-id="' + escapeHtml(id) + '">☰</span>' +
    '<input type="checkbox" data-act="toggle" data-id="' + escapeHtml(id) + '"' + (checked ? " checked" : "") + ">" +
    '<span class="name">' + escapeHtml(it.name) + "</span>";
  if (kids.length) html += '<span class="kidcount">' + kids.length + "件</span>";
  if (!isChild) html += '<button class="mini" data-act="addchild" data-id="' + escapeHtml(id) + '">＋子</button>';
  html += '<button class="del" data-act="del" data-id="' + escapeHtml(id) + '" aria-label="削除">✕</button></li>';
  return html;
}
function renderMain() {
  var cur = lists[currentListId];
  listTitle.textContent = cur ? cur.name : "リスト";
  var lv = leaves();
  var done = lv.filter(function (x) { return !!x.item.checked; }).length;
  progressText.textContent = done + " / " + lv.length + " 個チェック済み";
  progressFill.style.width = lv.length ? Math.round(done / lv.length * 100) + "%" : "0%";
  var html = "";
  var tops = topItems();
  if (tops.length) {
    html += '<ul class="items">';
    tops.forEach(function (t) {
      html += itemRow(t.id, t.item, false);
      if (!isCollapsed(t.id)) {
        childrenOf(t.id).forEach(function (c) { html += itemRow(c.id, c.item, true); });
      }
    });
    html += "</ul>";
  }
  if (!tops.length) {
    html = '<p class="empty">まだアイテムがありません。上の欄で追加するか、「定番（キャンプ）を追加」から始めてください。</p>';
  }
  listWrap.innerHTML = html;
}
function render() { renderSidebar(); renderMain(); }
function closeDrawer() {
  sidebar.classList.remove("open");
  sidebarBackdrop.classList.remove("show");
}
function updateTargetBar() {
  if (addTargetParentId && items[addTargetParentId]) {
    addTargetName.textContent = items[addTargetParentId].name;
    addTargetBar.classList.remove("hidden");
    addName.placeholder = "子アイテムを追加";
  } else {
    addTargetParentId = null;
    addTargetBar.classList.add("hidden");
    addName.placeholder = "アイテムを追加";
  }
}

/* ===== ローカル保存 ===== */
function persistLocal() {
  try { localStorage.setItem(LS_LOCAL_PREFIX + roomCode, JSON.stringify(localData)); } catch (e) {}
}
function convertOldItems(oldItems) {
  var out = {};
  var byCat = {};
  Object.keys(oldItems || {}).forEach(function (id) {
    var it = oldItems[id];
    var cat = MIGRATION_CATS.indexOf(it.cat) >= 0 ? it.cat : "遊び・その他";
    (byCat[cat] = byCat[cat] || []).push(it);
  });
  var ts = Date.now();
  MIGRATION_CATS.forEach(function (cat, ci) {
    var arr = byCat[cat];
    if (!arr || !arr.length) return;
    arr.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
    var pid = localId() + "-p" + ci;
    out[pid] = { name: cat, parentId: null, checked: false, ts: ts + ci * 1000 };
    arr.forEach(function (it, i) {
      out[localId() + "-c" + ci + "-" + i] = { name: it.name, parentId: pid, checked: !!it.checked, ts: ts + ci * 1000 + i + 1 };
    });
  });
  return out;
}
function presetItemsObj() {
  var out = {};
  var ts = Date.now();
  PRESET_TREE.forEach(function (g, gi) {
    var pid = localId() + "-pp" + gi;
    out[pid] = { name: g.name, parentId: null, checked: false, ts: ts + gi * 1000 };
    g.children.forEach(function (name, i) {
      out[localId() + "-pc" + gi + "-" + i] = { name: name, parentId: pid, checked: false, ts: ts + gi * 1000 + i + 1 };
    });
  });
  return out;
}
function loadLocal() {
  var raw = null;
  try { raw = localStorage.getItem(LS_LOCAL_PREFIX + roomCode); } catch (e) {}
  var parsed = null;
  if (raw) { try { parsed = JSON.parse(raw); } catch (e) {} }
  if (parsed && parsed.lists) {
    localData = parsed;
  } else if (parsed && Object.keys(parsed).length) {
    var lid = localId() + "-list";
    localData = { lists: {}, items: {}, current: lid };
    localData.lists[lid] = { name: "キャンプ", ts: Date.now() };
    localData.items[lid] = convertOldItems(parsed);
    persistLocal();
  } else {
    var lid2 = localId() + "-list";
    localData = { lists: {}, items: {}, current: lid2 };
    localData.lists[lid2] = { name: "キャンプ", ts: Date.now() };
    localData.items[lid2] = presetItemsObj();
    persistLocal();
  }
  lists = localData.lists;
  currentListId = localData.current && lists[localData.current] ? localData.current : sortedLists()[0].id;
  items = localData.items[currentListId] || {};
}

/* ===== 保存層 ===== */
function setConn(on, text) {
  connStatus.className = "conn" + (on ? " on" : "");
  connText.textContent = text;
}
function currentItemsRef() {
  if (!listsRef || !currentListId) return null;
  return listsRef.child(currentListId).child("items");
}
function syncFromAllData() {
  lists = {};
  Object.keys(allData).forEach(function (id) { lists[id] = { name: allData[id].name, ts: allData[id].ts || 0 }; });
  if (!currentListId || !lists[currentListId]) {
    var sl = sortedLists();
    currentListId = sl.length ? sl[0].id : null;
  }
  items = currentListId ? itemsOf(currentListId) : {};
}
function switchList(id) {
  if (!lists[id]) return;
  currentListId = id;
  addTargetParentId = null;
  if (localMode) { localData.current = id; items = localData.items[id] || {}; persistLocal(); }
  else items = itemsOf(id);
  updateTargetBar();
  closeDrawer();
  render();
}
function addList(name) {
  if (localMode) {
    var id = localId();
    localData.lists[id] = { name: name, ts: Date.now() };
    localData.items[id] = {};
    lists = localData.lists;
    persistLocal();
    switchList(id);
    return;
  }
  var ref = listsRef.push({ name: name, ts: Date.now() });
  currentListId = ref.key;
}
function deleteCurrentList() {
  if (sortedLists().length <= 1) { window.alert("最後の1つは削除できません。"); return; }
  var name = lists[currentListId] ? lists[currentListId].name : "";
  if (!window.confirm("リスト「" + name + "」を削除します。家族全員の画面からも消えます。よろしいですか？")) return;
  var id = currentListId;
  var rest = sortedLists().filter(function (l) { return l.id !== id; });
  if (localMode) {
    delete localData.lists[id];
    delete localData.items[id];
    lists = localData.lists;
    persistLocal();
    switchList(rest[0].id);
    return;
  }
  currentListId = rest[0].id;
  listsRef.child(id).remove();
}
function pushItem(data) {
  if (localMode) {
    var id = localId();
    items[id] = data;
    persistLocal();
    render();
    return id;
  }
  var r = currentItemsRef();
  return r ? r.push(data).key : null;
}
function updateFields(patch) {
  // patch: {itemId: {field: value, ...}}
  if (localMode) {
    Object.keys(patch).forEach(function (id) { if (items[id]) { for (var k in patch[id]) items[id][k] = patch[id][k]; } });
    persistLocal();
    render();
    return;
  }
  var r = currentItemsRef();
  if (r) {
    var upd = {};
    Object.keys(patch).forEach(function (id) {
      Object.keys(patch[id]).forEach(function (f) { upd[id + "/" + f] = patch[id][f]; });
    });
    r.update(upd);
  }
}
function updateItems(patch) { updateFields(patch); }
function removeItems(ids) {
  if (localMode) {
    ids.forEach(function (id) { delete items[id]; });
    persistLocal();
    render();
    return;
  }
  var r = currentItemsRef();
  if (r) {
    var upd = {};
    ids.forEach(function (id) { upd[id] = null; });
    r.update(upd);
  }
}
function toggleItem(id, checked) {
  var kids = childrenOf(id);
  if (kids.length) {
    var patch = {};
    kids.forEach(function (k) { patch[k.id] = { checked: checked }; });
    updateItems(patch);
  } else {
    var p = {}; p[id] = { checked: checked };
    updateItems(p);
  }
}
function setSiblingOrder(orderedIds) {
  var patch = {};
  orderedIds.forEach(function (id, i) { patch[id] = { ts: (i + 1) * 1000 }; });
  if (Object.keys(patch).length) updateFields(patch);
}
function moveItemToParent(id, newParentId) {
  var sibs = childrenOf(newParentId);
  var maxTs = sibs.reduce(function (m, s) { return Math.max(m, s.item.ts || 0); }, 0);
  var patch = {};
  patch[id] = { parentId: newParentId, ts: maxTs + 1000 };
  setCollapsed(newParentId, false);
  updateFields(patch);
}
function addPresets() {
  var existingTop = {};
  topItems().forEach(function (t) { existingTop[t.item.name] = true; });
  var ts = Date.now();
  PRESET_TREE.forEach(function (g, gi) {
    if (existingTop[g.name]) return;
    var pid = pushItem({ name: g.name, parentId: null, checked: false, ts: ts + gi * 1000 });
    if (!pid) return;
    g.children.forEach(function (name, i) {
      pushItem({ name: name, parentId: pid, checked: false, ts: ts + gi * 1000 + i + 1 });
    });
  });
}

/* ===== ドラッグ並び替え（MS To Do風： 長押し or ハンドルで開始し、行が指に追従する） ===== */
var drag = null;
var dragCandidate = null;
function rowBlock(li) {
  var els = [li];
  if (!li.classList.contains("child-row")) {
    var n = li.nextElementSibling;
    while (n && n.classList.contains("child-row")) { els.push(n); n = n.nextElementSibling; }
  }
  return els;
}
function clearDropMarks() {
  var marked = listWrap.querySelectorAll(".drop-target");
  for (var i = 0; i < marked.length; i++) marked[i].classList.remove("drop-target");
}
function isInteractiveTarget(t) {
  return !!(t.closest && t.closest("input, button, a"));
}
function rowFromTarget(t) {
  return t.closest ? t.closest("li[data-id]") : null;
}
function layoutTopOf(el) {
  // transformの影響を受けないレイアウト上の上端（viewport座標）
  var ul = drag ? drag.ul : el.parentElement;
  return ul.getBoundingClientRect().top + (el.offsetTop - ul.offsetTop);
}
function beginDrag(li, clientY) {
  var block = rowBlock(li);
  drag = {
    id: li.getAttribute("data-id"),
    isChild: li.classList.contains("child-row"),
    parentId: li.getAttribute("data-parent") || null,
    block: block,
    ul: li.parentElement,
    startY: clientY,
    lastY: clientY,
    startTop: 0,
    layoutTop: 0,
    dy: 0,
    dropParentId: null,
    moved: false,
    raf: 0
  };
  drag.startTop = layoutTopOf(li);
  drag.layoutTop = drag.startTop;
  block.forEach(function (el) {
    el.classList.add("drag-lift");
    el.style.position = "relative";
    el.style.zIndex = "5";
  });
  if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
  drag.raf = requestAnimationFrame(dragTick);
}
function dragTick() {
  if (!drag) return;
  var mr = mainScroll.getBoundingClientRect();
  var y = drag.lastY;
  var scrolled = false;
  if (y < mr.top + 56) { mainScroll.scrollTop -= 14; scrolled = true; }
  else if (y > mr.bottom - 56) { mainScroll.scrollTop += 14; scrolled = true; }
  if (scrolled) dragMoveTo(y);
  drag.raf = requestAnimationFrame(dragTick);
}
function setDragTransform() {
  if (!drag) return;
  var tf = "translateY(" + drag.dy + "px)";
  drag.block.forEach(function (el) { el.style.transform = tf; });
}
function flipAnimate(ul, mutate) {
  var rows = Array.prototype.slice.call(ul.children);
  var tops = {};
  rows.forEach(function (r) { tops[r.getAttribute("data-id")] = r.getBoundingClientRect().top; });
  mutate();
  rows.forEach(function (r) {
    if (drag && drag.block.indexOf(r) >= 0) return;
    var old = tops[r.getAttribute("data-id")];
    if (old === undefined) return;
    var dy = old - r.getBoundingClientRect().top;
    if (dy) {
      r.style.transition = "none";
      r.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(function () {
        r.style.transition = "transform 180ms ease";
        r.style.transform = "";
      });
    }
  });
}
function dragMoveTo(clientY) {
  if (!drag) return;
  drag.moved = true;
  drag.lastY = clientY;
  var desired = drag.startTop + (clientY - drag.startY);
  drag.dy = desired - drag.layoutTop;
  setDragTransform();
  drag.dropParentId = null;
  clearDropMarks();
  var rows = Array.prototype.slice.call(drag.ul.children);
  if (drag.isChild) {
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.classList.contains("child-row") || drag.block.indexOf(r) >= 0) continue;
      var pid = r.getAttribute("data-id");
      if (!pid || pid === drag.parentId) continue;
      var rTop = layoutTopOf(r);
      if (clientY >= rTop && clientY <= rTop + r.offsetHeight) {
        drag.dropParentId = pid;
        r.classList.add("drop-target");
        return;
      }
    }
  }
  var target = null, before = true;
  for (var j = 0; j < rows.length; j++) {
    var row = rows[j];
    if (drag.block.indexOf(row) >= 0) continue;
    if (drag.isChild) {
      if (!row.classList.contains("child-row")) continue;
      if ((row.getAttribute("data-parent") || null) !== drag.parentId) continue;
    } else {
      if (row.classList.contains("child-row")) continue;
    }
    var mid = layoutTopOf(row) + row.offsetHeight / 2;
    if (clientY < mid) { target = row; before = true; break; }
    target = row; before = false;
  }
  if (!target) return;
  var first = drag.block[0], last = drag.block[drag.block.length - 1];
  var insertion = null;
  if (before) {
    if (target === first) return;
    insertion = function () { drag.block.forEach(function (el) { drag.ul.insertBefore(el, target); }); };
  } else {
    var tBlock = rowBlock(target);
    var anchor = tBlock[tBlock.length - 1];
    if (anchor === last) return;
    var ref = anchor.nextElementSibling;
    insertion = function () { drag.block.forEach(function (el) { drag.ul.insertBefore(el, ref); }); };
  }
  flipAnimate(drag.ul, insertion);
  drag.layoutTop = layoutTopOf(drag.block[0]);
  drag.dy = desired - drag.layoutTop;
  setDragTransform();
}
function endDrag() {
  if (!drag) return;
  var ds = drag;
  drag = null;
  if (ds.raf) cancelAnimationFrame(ds.raf);
  clearDropMarks();
  var finish = function () {
    ds.block.forEach(function (el) {
      el.classList.remove("drag-lift");
      el.style.transform = "";
      el.style.transition = "";
      el.style.position = "";
      el.style.zIndex = "";
    });
    if (ds.isChild && ds.dropParentId) { moveItemToParent(ds.id, ds.dropParentId); return; }
    var rows = Array.prototype.slice.call(ds.ul.children);
    var ordered = [];
    rows.forEach(function (r) {
      if (ds.isChild) {
        if (r.classList.contains("child-row") && (r.getAttribute("data-parent") || null) === ds.parentId) ordered.push(r.getAttribute("data-id"));
      } else {
        if (!r.classList.contains("child-row")) ordered.push(r.getAttribute("data-id"));
      }
    });
    var current = (ds.isChild ? childrenOf(ds.parentId) : topItems()).map(function (x) { return x.id; });
    var changed = ordered.length !== current.length || ordered.some(function (id, i) { return id !== current[i]; });
    if (changed) setSiblingOrder(ordered);
    else render();
  };
  if (ds.moved) {
    ds.block.forEach(function (el) { el.style.transition = "transform 180ms ease"; el.style.transform = "translateY(0px)"; });
    setTimeout(finish, 190);
  } else {
    finish();
  }
}

/* ===== Firebase移行（旧形式→リスト形式） ===== */
function migrateFirebase(rootRef, oldItems) {
  var listRef = rootRef.child("lists").push();
  var listId = listRef.key;
  var converted = {};
  if (oldItems && Object.keys(oldItems).length) {
    var byCat = {};
    Object.keys(oldItems).forEach(function (id) {
      var it = oldItems[id];
      var cat = MIGRATION_CATS.indexOf(it.cat) >= 0 ? it.cat : "遊び・その他";
      (byCat[cat] = byCat[cat] || []).push(it);
    });
    var ts = Date.now();
    MIGRATION_CATS.forEach(function (cat, ci) {
      var arr = byCat[cat];
      if (!arr || !arr.length) return;
      arr.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
      var pid = rootRef.child("lists").child(listId).child("items").push().key;
      converted[pid] = { name: cat, parentId: null, checked: false, ts: ts + ci * 1000 };
      arr.forEach(function (it, i) {
        var cid = rootRef.child("lists").child(listId).child("items").push().key;
        converted[cid] = { name: it.name, parentId: pid, checked: !!it.checked, ts: ts + ci * 1000 + i + 1 };
      });
    });
  } else {
    var tmp = presetItemsObj();
    Object.keys(tmp).forEach(function (k) { converted[k] = tmp[k]; });
  }
  var upd = {};
  var listObj = { name: "キャンプ", ts: Date.now() };
  listObj.items = converted;
  upd["lists/" + listId] = listObj;
  upd["items"] = null;
  return rootRef.update(upd);
}

/* ===== 入室 ===== */
function attachListsListener() {
  listsRef.on("value", function (snap) {
    allData = snap.val() || {};
    syncFromAllData();
    setConn(true, "同期中（家族と共有しています）");
    updateTargetBar();
    render();
  }, function (err) { setConn(false, "接続エラー：" + err.message); });
}
function enterRoom(code) {
  roomCode = code;
  loadCollapsed();
  localMode = !(CONFIG_READY && typeof firebase !== "undefined");
  if (localMode) {
    setConn(false, "ローカルモード（この端末内だけ・同期しません）");
    loadLocal();
    render();
    return;
  }
  if (!db) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); }
  var rootRef = db.ref("rooms/" + code);
  listsRef = rootRef.child("lists");
  rootRef.once("value").then(function (snap) {
    var val = snap.val() || {};
    var p = val.lists ? Promise.resolve() : migrateFirebase(rootRef, val.items || {});
    return p;
  }).then(function () {
    attachListsListener();
  }).catch(function () {
    setConn(false, "接続エラー（移行に失敗しました）");
    attachListsListener();
  });
}

/* ===== イベント ===== */
$("menuBtn").addEventListener("click", function () {
  sidebar.classList.add("open");
  sidebarBackdrop.classList.add("show");
});
sidebarBackdrop.addEventListener("click", closeDrawer);
$("shareBtn").addEventListener("click", function () {
  var url = location.origin + location.pathname;
  var text = "持ち物チェック\n" + url;
  function done() { $("shareBtn").textContent = "コピーしました ✓"; setTimeout(function () { $("shareBtn").textContent = "共有リンクをコピー"; }, 2000); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { window.prompt("このリンクを家族に送ってください", url); });
  } else { window.prompt("このリンクを家族に送ってください", url); }
});
$("newListBtn").addEventListener("click", function () {
  var name = window.prompt("新しいリストの名前を入力してください（例： 買い物、旅行）", "");
  if (name && name.trim()) addList(name.trim());
});
sidebarLists.addEventListener("click", function (e) {
  var t = e.target;
  var li = t.closest ? t.closest("[data-list]") : null;
  var lid = li ? li.getAttribute("data-list") : (t.getAttribute && t.getAttribute("data-list"));
  if (lid) switchList(lid);
});
$("addBtn").addEventListener("click", function () {
  var name = addName.value.trim();
  if (!name) { addMsg.textContent = "アイテム名を入力してください。"; return; }
  addMsg.textContent = "";
  var pid = null;
  if (addTargetParentId && items[addTargetParentId] && !items[addTargetParentId].parentId) {
    pid = addTargetParentId;
    setCollapsed(pid, false);
  }
  pushItem({ name: name, parentId: pid, checked: false, ts: Date.now() });
  addName.value = "";
  addName.focus();
  if (localMode) render();
});
addName.addEventListener("keydown", function (e) { if (e.key === "Enter") $("addBtn").click(); });
$("addTargetClear").addEventListener("click", function () {
  addTargetParentId = null;
  updateTargetBar();
  addName.focus();
});
listWrap.addEventListener("click", function (e) {
  var t = e.target;
  var act = t.getAttribute && t.getAttribute("data-act");
  if (!act) return;
  var id = t.getAttribute("data-id");
  if (act === "del") {
    var kids = childrenOf(id);
    if (kids.length) {
      if (!window.confirm("「" + items[id].name + "」とその子アイテム" + kids.length + "件を削除します。よろしいですか？")) return;
      removeItems([id].concat(kids.map(function (k) { return k.id; })));
    } else {
      removeItems([id]);
    }
    if (addTargetParentId === id) { addTargetParentId = null; updateTargetBar(); }
  } else if (act === "addchild") {
    addTargetParentId = id;
    setCollapsed(id, false);
    updateTargetBar();
    render();
    addName.focus();
  } else if (act === "collapse") {
    setCollapsed(id, !isCollapsed(id));
    render();
  }
});
listWrap.addEventListener("change", function (e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute("data-act") === "toggle") {
    toggleItem(t.getAttribute("data-id"), t.checked);
  }
});
/* ドラッグ開始の配線： マウスは少し動かしたら、タッチは長押し（ハンドルは即時） */
listWrap.addEventListener("pointerdown", function (e) {
  if (e.pointerType !== "mouse") return;
  if (isInteractiveTarget(e.target)) return;
  var li = rowFromTarget(e.target);
  if (!li) return;
  e.preventDefault();
  dragCandidate = { li: li, x: e.clientX, y: e.clientY, mouse: true };
});
window.addEventListener("pointermove", function (e) {
  if (e.pointerType === "touch") return;
  if (drag) { dragMoveTo(e.clientY); return; }
  if (dragCandidate && dragCandidate.mouse) {
    if (Math.abs(e.clientY - dragCandidate.y) > 5 || Math.abs(e.clientX - dragCandidate.x) > 5) {
      var li = dragCandidate.li;
      dragCandidate = null;
      beginDrag(li, e.clientY);
      dragMoveTo(e.clientY);
    }
  }
});
window.addEventListener("pointerup", function () {
  if (drag) endDrag();
  dragCandidate = null;
});
window.addEventListener("pointercancel", function () {
  if (drag) endDrag();
  dragCandidate = null;
});
listWrap.addEventListener("touchstart", function (e) {
  if (drag) return;
  var t = e.target;
  if (isInteractiveTarget(t)) return;
  var li = rowFromTarget(t);
  if (!li) return;
  var touch = e.touches[0];
  var immediate = !!(t.getAttribute && t.getAttribute("data-handle"));
  dragCandidate = { li: li, x: touch.clientX, y: touch.clientY, touch: true, timer: null };
  if (!immediate) {
    dragCandidate.timer = setTimeout(function () {
      if (dragCandidate && dragCandidate.touch) {
        beginDrag(dragCandidate.li, dragCandidate.y);
        dragCandidate = null;
      }
    }, 400);
  }
}, { passive: true });
listWrap.addEventListener("touchmove", function (e) {
  if (drag) {
    e.preventDefault();
    dragMoveTo(e.touches[0].clientY);
    return;
  }
  if (dragCandidate && dragCandidate.touch) {
    var touch = e.touches[0];
    var movedFar = Math.abs(touch.clientY - dragCandidate.y) > 12 || Math.abs(touch.clientX - dragCandidate.x) > 12;
    if (dragCandidate.timer) {
      if (movedFar) { clearTimeout(dragCandidate.timer); dragCandidate = null; }
    } else if (movedFar) {
      var li = dragCandidate.li;
      dragCandidate = null;
      beginDrag(li, touch.clientY);
      e.preventDefault();
      dragMoveTo(touch.clientY);
    }
  }
}, { passive: false });
function onTouchEnd() {
  if (dragCandidate && dragCandidate.timer) clearTimeout(dragCandidate.timer);
  dragCandidate = null;
  if (drag) endDrag();
}
listWrap.addEventListener("touchend", onTouchEnd);
listWrap.addEventListener("touchcancel", onTouchEnd);
$("resetChecksBtn").addEventListener("click", function () {
  var patch = {};
  leaves().forEach(function (x) { if (x.item.checked) patch[x.id] = { checked: false }; });
  if (Object.keys(patch).length) updateItems(patch);
});
$("addPresetBtn").addEventListener("click", function () { addPresets(); });
$("clearAllBtn").addEventListener("click", function () {
  if (!window.confirm("今開いているリストのアイテムをすべて削除します。家族全員の画面からも消えます。よろしいですか？")) return;
  if (localMode) { localData.items[currentListId] = {}; items = localData.items[currentListId]; addTargetParentId = null; updateTargetBar(); persistLocal(); render(); }
  else { var r = currentItemsRef(); if (r) r.remove(); }
});
$("deleteListBtn").addEventListener("click", deleteCurrentList);

/* ===== 起動： 家族のリストに自動入室（合言葉なし） ===== */
(function init() {
  var m = /[?&]room=([^&]+)/.exec(location.search || "");
  var code = m ? decodeURIComponent(m[1]) : DEFAULT_ROOM;
  enterRoom(validRoomCode(code) ? code : DEFAULT_ROOM);
})();
</script>
